[package]
name = "ultrahonk_verifier_program"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scaffold of a staged UltraHonk Solana verifier state machine"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
default = []
sbf-entrypoint = []

[dependencies]
solana-program = "3.0.0"
solana-bn254 = "3.2.1"

[dev-dependencies]
solana-account = "3.1.0"
solana-compute-budget-interface = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.1.0"
solana-program-test = "3.1.8"
solana-pubkey = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
tokio = { version = "1.48.0", features = ["full"] }
